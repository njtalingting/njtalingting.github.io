project:
  type: website
  resources:
    - "google*.html"  # Keeps Google Search Console verification file alive

website:
  title: "NJ Talingting"
  description: "Connecting fragmented geographies."
  favicon: images/logo.svg
  
  # 1. Replaced navbar with sidebar configuration
  sidebar:
    style: "docked"
    background: "#1a1a1a"       # Gives you the dark sidebar style from the image
    logo: images/logo.svg
    contents:
      - href: index.qmd
        text: Home
      - href: software.qmd
        text: Software
      - href: recognition.qmd
        text: Recognition
      - href: resources.qmd
        text: Resources

  page-footer:
    left: "© 2026 NJ Talingting"

format:
  html:
    theme: 
      - cosmo
      - light                   # Keeps the main body area light colored
    css: styles.css
    theme-toggle: true           # Activates the sun/moon button safely
    toc: true
    include-in-header: schema.html
