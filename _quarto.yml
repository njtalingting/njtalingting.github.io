project:
  type: website
  resources:
    - "google*.html"  # Keeps Google Search Console verification file alive

website:
  title: "NJ Talingting"
  favicon: images/logo.svg
  
  sidebar:
    style: "docked"
    # 1. Custom layout template inserting your tagline right under your title
    header: |
      <div class="sidebar-description">Connecting fragmented geographies.</div>
    
    contents:
      - href: index.qmd
        text: Home
      - href: software.qmd
        text: Software
      - href: recognition.qmd
        text: Recognition
      - href: resources.qmd
        text: Resources

    # 2. Replicates the clean horizontal grid of icons right below your links
    tools:
      - icon: github
        href: https://github.com/njtalingting
      - icon: linkedin
        href: https://linkedin.com/njtalingting
      - icon: envelope
        href: mailto:ninotalingting77@gmail.com

  page-footer:
    left: "© 2026 NJ Talingting"

format:
  html:
    theme: 
      - cosmo
      - light                   
    css: styles.css
    theme-toggle: true           
    toc: true
    include-in-header: schema.html
